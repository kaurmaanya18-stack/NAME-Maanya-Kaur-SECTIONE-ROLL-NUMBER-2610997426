
<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>
<body>

<h1>Online Course Registration</h1>

<form action="#" method="post" target="_self" enctype="multipart/form-data">

    <input type="hidden" name="form_name" value="Online Course Registration">

    <h3>Personal Information</h3>

    <label for="name">Student Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>
    <br><br>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <br><br>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
    <br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" placeholder="Enter your age">
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter password" required>
    <br><br>

    <p>Gender:</p>

    <input type="radio" id="male" name="gender" value="Male" required>
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>

    <input type="radio" id="other" name="gender" value="Other">
    <label for="other">Other</label>
    <br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob">
    <br><br>

    <h3>Course Preferences</h3>

    <p>Skills:</p>

    <input type="checkbox" id="html" name="skills" value="HTML">
    <label for="html">HTML</label>

    <input type="checkbox" id="css" name="skills" value="CSS">
    <label for="css">CSS</label>

    <input type="checkbox" id="javascript" name="skills" value="JavaScript">
    <label for="javascript">JavaScript</label>

    <input type="checkbox" id="python" name="skills" value="Python">
    <label for="python">Python</label>
    <br><br>

    <label for="course">Select Course:</label>
    <select id="course" name="course" required>
        <option value="" disabled selected>Select a course</option>
        <option value="Web Development">Web Development</option>
        <option value="Python Programming">Python Programming</option>
        <option value="Data Analytics">Data Analytics</option>
        <option value="Digital Marketing">Digital Marketing</option>
    </select>
    <br><br>

    <label for="time">Preferred Class Time:</label>
    <input type="time" id="time" name="time">
    <br><br>

    <h3>Additional Information</h3>

    <label for="address">Address:</label>
    <br>
    <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea>
    <br><br>

    <label for="additional">Additional Details:</label>
    <br>
    <textarea id="additional" name="additional" rows="4" cols="30" placeholder="Enter additional information"></textarea>
    <br><br>

    <label for="file">Upload Document or Photograph:</label>
    <input type="file" id="file" name="file" accept=".pdf,.jpg,.jpeg,.png">
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
